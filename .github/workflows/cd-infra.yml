name: CD - Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/cd-infra.yml"

concurrency:
  group: cd-infra
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: credentials available?
        id: check
        env:
          ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "$ROLE" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: infra cd disabled
        if: steps.check.outputs.enabled == 'false'
        run: echo "Infra CD is disabled. Set AWS_ROLE_TO_ASSUME and AWS_REGION secrets (OIDC) to run terraform plan/apply on main."

      - uses: actions/checkout@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          terraform_version: 1.15.8
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 1200

      - name: init
        if: steps.check.outputs.enabled == 'true'
        run: |
          cd terraform/envs/dev
          terraform init -input=false

      - name: plan
        if: steps.check.outputs.enabled == 'true'
        id: plan
        run: |
          cd terraform/envs/dev
          terraform plan -out=tfplan -input=false

      - name: apply
        if: steps.check.outputs.enabled == 'true'
        run: |
          cd terraform/envs/dev
          terraform apply -auto-approve tfplan