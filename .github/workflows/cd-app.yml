name: CD - Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "gitops/apps/**"
      - "gitops/app-infra/**"

concurrency:
  group: cd-apps
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER_LOWER: ${{ github.repository_owner }}
      SERVICES: "api worker web"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: login registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin

      - name: lower-owner
        id: owner
        run: echo "value=${OWNER_LOWER,,}" >> "$GITHUB_OUTPUT"

      - name: build + push images
        env:
          IMG_BASE: ghcr.io/${{ steps.owner.outputs.value }}/aws-gitops
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            docker buildx build \
              --push \
              --platform linux/amd64 \
              -t "${IMG_BASE}-${svc}:${{ github.sha }}" \
              -t "${IMG_BASE}-${svc}:latest" \
              "apps/${svc}"
          done

      - name: bump image tags in gitops
        env:
          IMG_BASE: ghcr.io/${{ steps.owner.outputs.value }}/aws-gitops
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            (cd "gitops/apps/${svc}" && kustomize edit set image "${svc}=${IMG_BASE}-${svc}:${{ github.sha }}")
          done
          git diff --stat

      - name: commit + push tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add gitops/apps
            git commit -m "chore(apps): bump image tags to ${{ github.sha }} [skip ci]"
            git push
          fi