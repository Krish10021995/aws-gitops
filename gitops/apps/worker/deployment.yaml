apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: worker:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: demoapp-db
          env:
            - name: POLL_SECONDS
              value: "10"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 192Mi